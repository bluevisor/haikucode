name: Release

# Build the macOS and Linux binaries and attach them to a release, beside the
# Haiku packages haiku/release.sh uploads. Runs when a release is published,
# and can be re-run by hand (workflow_dispatch) to backfill a release's assets.
# Each tarball holds one `haikucode`; `haikucode update` picks its own by name.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload assets for (e.g. v0.1.5)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Static musl builds via `cross`: they run on any distro and glibc, from a
  # Pi Zero W (ARMv6) to a Jetson or an x86_64 server.
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: linux-x86_64
          - target: aarch64-unknown-linux-musl
            asset: linux-arm64
          - target: armv7-unknown-linux-musleabihf
            asset: linux-armv7
          - target: arm-unknown-linux-musleabihf
            asset: linux-armv6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --locked
      - name: Build (release)
        env:
          HAIKUCODE_ASSET: ${{ matrix.asset }}
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          # Untrusted (free-form dispatch input) — keep out of the command body.
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "refusing non-version tag: $TAG" >&2; exit 1 ;; esac
          NAME="haikucode-${TAG#v}-${ASSET}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "$NAME" haikucode
          gh release upload "$TAG" "$NAME" --clobber

  # Native Apple Silicon and cross x86_64 builds on a macOS runner.
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: macos-arm64
          - target: x86_64-apple-darwin
            asset: macos-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build (release)
        env:
          HAIKUCODE_ASSET: ${{ matrix.asset }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "refusing non-version tag: $TAG" >&2; exit 1 ;; esac
          NAME="haikucode-${TAG#v}-${ASSET}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "$NAME" haikucode
          gh release upload "$TAG" "$NAME" --clobber
