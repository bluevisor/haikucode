name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned so a new Rust release can't turn main red with fresh clippy lints.
  # Bump it deliberately, fixing whatever the new clippy reports in the same PR.
  RUST_VERSION: "1.94.1"

jobs:
  # Hard gates: the code compiles, every unit test passes and clippy is clean.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup is preinstalled on GitHub runners; no third-party toolchain action.
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --verbose
      - name: Test
        run: cargo test --bins --locked --verbose
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # Advisory: the tree predates rustfmt, and reformatting it in one go
      # would conflict with every open branch. Format the code you touch.
      - name: Format check (advisory)
        run: cargo fmt --check || true
