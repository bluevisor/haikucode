[package]
name = "haikucode"
version = "0.1.12"
edition = "2021"
description = "Haiku Code: a full-screen agentic coding CLI for Haiku (a picoder port)"

[[bin]]
name = "haikucode"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
regex = "1"
unicode-normalization = "0.1"
glob = "0.3"
similar = "2"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width", "unicode-linebreak"] }
unicode-width = "0.2"
anyhow = "1"
libc = "0.2"
# SHA-256 for verifying OTA update packages (already built for rustls).
ring = "0.17"

# crossterm's default mio event source goes deaf after the first batch of keys
# on Haiku (mio's poll(2) selector never reports the tty readable again), so
# the TUI froze on its second keypress. The use-dev-tty source polls the tty
# itself and delivers every key. Same crossterm ratatui re-exports.
[target.'cfg(target_os = "haiku")'.dependencies]
crossterm = { version = "0.28.1", features = ["use-dev-tty"] }

[profile.release]
# Haiku boxes (and VMs) have RAM to spare, so favor speed over size.
opt-level = 3
lto = true
codegen-units = 1
strip = true
